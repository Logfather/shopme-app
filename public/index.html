<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>ShopBuddy Einladung</title>

    <!-- Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background: #F7F7F7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        .card {
            background: #FFFFFF;
            padding: 32px 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .icon {
            width: 140px;
            height: 140px;
            margin-bottom: 24px;
        }

        h2 {
            margin: 0;
            font-weight: 600;
            font-size: 22px;
            color: #2E2E2E;
        }

        p {
            margin-top: 8px;
            font-size: 15px;
            color: rgba(46,46,46,0.7);
            line-height: 1.4;
        }

        .primary-button {
            display: block;
            margin-top: 32px;
            padding: 14px 20px;
            background: #809C13; /* BrandGreen */
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        }

        .secondary-button {
            display: inline-block;
            margin-top: 16px;
            color: #809C13;
            text-decoration: none;
            font-weight: 600;
        }

        .secondary-button:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- 🛍️ ShopBuddy Icon -->
        <img src="shopBuddy_happy_bag_icon.png" class="icon" alt="ShopBuddy" />

        <!-- Titel -->
        <h2>ShopBuddy Einladung</h2>

        <!-- Beschreibung -->
        <p>"Platzhalter" hat dich zu einer gemeinsamen Einkaufsliste eingeladen.</p>

        <!-- Primary CTA -->
        <a id="openApp" class="primary-button">
            In ShopBuddy App öffnen
        </a>

        <!-- Secondary CTA -->
        <a id="joinFallback" class="secondary-button">
            Oder im Browser öffnen
        </a>

    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search)
    const inviteId = params.get("inviteId")

    const deepLink = `shopbuddy://invite/${inviteId}`
    const fallback = `https://shopme-app.de/invite?inviteId=${inviteId}`

    const openButton = document.getElementById("openApp")

    openButton.addEventListener("click", function (e) {
        e.preventDefault()

        // Versuch App zu öffnen
        window.location.href = deepLink

        // Fallback nach Delay
        setTimeout(() => {
            window.location.href = fallback
        }, 1200)
    })
</script>

</body>
</html>
